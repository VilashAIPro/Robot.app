      left: 50%;

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      const [experience, setExperience] = useState('landing'); // landing, robot3d, mobile_app, dashboard, satellite, soil, weather, disease, government, dpi, impact, datasets, contact
      const [lang, setLang] = useState('en');
      const [selectedComponent, setSelectedComponent] = useState(ROBOT_COMPONENTS[0]);
      const [explodedView, setExplodedView] = useState(false);
      const [robotRotating, setRobotRotating] = useState(true);
      const [mobileScreen, setMobileScreen] = useState('home'); // home, scan, robot, weather, profile, schemes
      const [diseaseScanState, setDiseaseScanState] = useState(null);
      const [voiceListening, setVoiceListening] = useState(false);
      const [voiceResponse, setVoiceResponse] = useState(null);
      const [robotBattery, setRobotBattery] = useState(88);
      const [robotSolar, setRobotSolar] = useState(145);
      const [robotStatus, setRobotStatus] = useState('Autonomous Weeding');
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [mobileFrameMode, setMobileFrameMode] = useState(true);

      const canvasRef = useRef(null);

      // 3D Canvas Robot Simulation
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationId;
        let rotAngle = 0;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;

          // Draw cyber grid
          ctx.strokeStyle = 'rgba(102, 187, 106, 0.15)';
          ctx.lineWidth = 1;
          for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
          }
          for (let y = 0; y < canvas.height; y += 30) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
          }

          ctx.save();
          ctx.translate(cx, cy);

          if (robotRotating) {
            rotAngle += 0.015;
          }

          const scaleX = Math.cos(rotAngle);
          const explodedOffset = explodedView ? 40 : 0;

          // Wheels
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#66BB6A';
          ctx.lineWidth = 2;

          // Left wheels
          ctx.fillRect(-110 * scaleX - 15, -60 - explodedOffset, 30 * Math.abs(scaleX) + 5, 50);
          ctx.strokeRect(-110 * scaleX - 15, -60 - explodedOffset, 30 * Math.abs(scaleX) + 5, 50);

          ctx.fillRect(-110 * scaleX - 15, 20 + explodedOffset, 30 * Math.abs(scaleX) + 5, 50);
          ctx.strokeRect(-110 * scaleX - 15, 20 + explodedOffset, 30 * Math.abs(scaleX) + 5, 50);

          // Right wheels
          ctx.fillRect(80 * scaleX, -60 - explodedOffset, 30 * Math.abs(scaleX) + 5, 50);
          ctx.strokeRect(80 * scaleX, -60 - explodedOffset, 30 * Math.abs(scaleX) + 5, 50);

          ctx.fillRect(80 * scaleX, 20 + explodedOffset, 30 * Math.abs(scaleX) + 5, 50);
          ctx.strokeRect(80 * scaleX, 20 + explodedOffset, 30 * Math.abs(scaleX) + 5, 50);

          // Chassis Main Body
          ctx.fillStyle = '#061c10';
          ctx.strokeStyle = '#2E7D32';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-80 * scaleX, -70, 160 * scaleX, 140, 16);
          ctx.fill();
          ctx.stroke();

          // Solar Roof Panel
          ctx.fillStyle = '#0284c7';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(-65 * scaleX, -55 - explodedOffset, 130 * scaleX, 90, 8);
          ctx.fill();
          ctx.stroke();

          // Solar Grid Pattern
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1;
          for (let s = -40; s <= 40; s += 20) {
            ctx.beginPath();
            ctx.moveTo(s * scaleX, -55 - explodedOffset);
            ctx.lineTo(s * scaleX, 35 - explodedOffset);
            ctx.stroke();
          }

          // Top LiDAR Dome
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.arc(0, -75 - (explodedOffset * 1.5), 14 * Math.abs(scaleX) + 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#a7f3d0';
          ctx.stroke();

          // Front 4K Camera & Ultrasonic Eyes
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(-25 * scaleX, 65 + explodedOffset, 7, 0, Math.PI * 2);
          ctx.arc(25 * scaleX, 65 + explodedOffset, 7, 0, Math.PI * 2);
          ctx.fill();

          // Laser Weeder / Sprayer Bar
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(-95 * scaleX, 75 + (explodedOffset * 1.3), 190 * scaleX, 12);

          ctx.restore();

          animationId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationId);

              </div>

              {/* Navigation Experience Switcher */}
              <nav className="hidden xl:flex items-center gap-1 bg-slate-900/90 p-1.5 rounded-2xl border border-white/10 text-xs font-semibold">
                {[

                <button

              </div>
            </div>
          </header>

          {/* EXPERIENCE ROUTER */}
          <main className="flex-1">
            {/* 1. HERO & LANDING PAGE */}
            {experience === 'landing' && (
              <div className="space-y-20 pb-24">

                    {/* Badge */}
                    <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-bold uppercase tracking-wider">

                      <span>Hall of Community Hackathon 2.0 • Digital Public Infrastructure</span>
                    </div>

                    {/* Main Headline */}

                        className="px-8 py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold text-sm sm:text-base shadow-2xl shadow-emerald-950/80 transition-all transform hover:-translate-y-1 flex items-center gap-2"

                      src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1200&auto=format&fit=crop&q=80"
                      alt="Satellite Map"
                      className="w-full h-full object-cover brightness-110 saturate-150"
                    />
                    <div className="absolute inset-0 bg-emerald-900/30"></div>

                    {/* Polygon Overlay */}
                    <div className="absolute top-8 left-12 right-12 bottom-8 border-2 border-emerald-400 bg-emerald-500/20 rounded-2xl flex items-center justify-center font-mono font-bold text-white text-xs">
                      Plot 4.8 Ac (Average NDVI: 0.74 • High Canopy Chlorophyll)
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3 text-center text-xs">
                    <div className="p-3 bg-slate-900 rounded-xl"><span className="text-slate-400">NDVI Vigor</span><p className="font-bold text-emerald-400 text-lg">0.74</p></div>
                    <div className="p-3 bg-slate-900 rounded-xl"><span className="text-slate-400">NDWI Water</span><p className="font-bold text-cyan-400 text-lg">0.32 (Optimal)</p></div>
                    <div className="p-3 bg-slate-900 rounded-xl"><span className="text-slate-400">Surface Temp</span><p className="font-bold text-amber-400 text-lg">28.2°C</p></div>
                  </div>
                </div>
              </div>
            )}

            {/* 5. SOIL HEALTH INTELLIGENCE */}
            {experience === 'soil' && (
              <div className="max-w-7xl mx-auto px-4 py-8 space-y-6 animate-fadeIn">
                <div className="glass-card-glow rounded-3xl p-6 lg:p-8">
                  <h1 className="font-heading font-black text-3xl text-white">
                    🧪 Soil Health Card (SHC) & Subsoil EC Intelligence
                  </h1>
                  <p className="text-slate-300 text-sm mt-1">
                    Laboratory certified macronutrient profile (NPK), pH, and organic carbon with automated compost dosing.
                  </p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                  <div className="glass-card rounded-2xl p-5"><span className="text-xs text-slate-400">Soil pH</span><p className="text-3xl font-black text-amber-400 font-numbers mt-1">6.8</p><span className="text-[10px] text-emerald-400">Neutral</span></div>
                  <div className="glass-card rounded-2xl p-5"><span className="text-xs text-slate-400">Moisture</span><p className="text-3xl font-black text-cyan-400 font-numbers mt-1">68%</p><span className="text-[10px] text-cyan-300">Optimal</span></div>
                  <div className="glass-card rounded-2xl p-5"><span className="text-xs text-slate-400">Nitrogen</span><p className="text-3xl font-black text-emerald-400 font-numbers mt-1">242</p><span className="text-[10px] text-slate-400">kg/ha</span></div>
                  <div className="glass-card rounded-2xl p-5"><span className="text-xs text-slate-400">Org Carbon</span><p className="text-3xl font-black text-purple-400 font-numbers mt-1">0.72%</p><span className="text-[10px] text-slate-400">Medium</span></div>
                </div>
              </div>
            )}

            {/* 6. GOVERNMENT GIS */}
            {experience === 'government' && (
              <div className="max-w-7xl mx-auto px-4 py-8 space-y-6 animate-fadeIn">
                <div className="glass-card-glow rounded-3xl p-6 lg:p-8">
                  <h1 className="font-heading font-black text-3xl text-white">
                    🏛️ Government GIS & State Macro Registry
                  </h1>
                  <p className="text-slate-300 text-sm mt-1">
                    State-by-state telemetry federating 8 state agricultural directorates and 15,000+ autonomous farming robots.
                  </p>
                </div>

                <div className="glass-card rounded-3xl p-6 overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-white/10 text-slate-400">
                        <th className="pb-3">State Node</th>
                        <th className="pb-3">Registered Farmers</th>
                        <th className="pb-3">Active Robots</th>
                        <th className="pb-3">Acreage</th>
                        <th className="pb-3">Soil Index</th>
                        <th className="pb-3">Federated Model</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/5">
                      {GOVERNMENT_STATES.map((s, idx) => (
                        <tr key={idx} className="hover:bg-white/5">
                          <td className="py-3.5 font-bold text-white">{s.state}</td>
                          <td className="py-3.5 text-slate-300 font-mono">{s.farmers}</td>
                          <td className="py-3.5 text-cyan-400 font-bold font-mono">{s.robots}</td>
                          <td className="py-3.5 text-slate-300 font-mono">{s.acreage}</td>
                          <td className="py-3.5 text-emerald-400 font-bold">{s.soil}/100</td>
                          <td className="py-3.5 text-slate-300 font-mono">{s.model}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 7. DATASETS (data.gov.in) */}
            {experience === 'datasets' && (
              <div className="max-w-7xl mx-auto px-4 py-8 space-y-6 animate-fadeIn">
                <div className="glass-card-glow rounded-3xl p-6 lg:p-8">
                  <h1 className="font-heading font-black text-3xl text-white">
                    📊 Open Government Agriculture Datasets (data.gov.in)
                  </h1>
                  <p className="text-slate-300 text-sm mt-1">
                    Verifiable public datasets integrated into the AgriNet Digital Public Infrastructure architecture.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {DATASETS.map((ds, idx) => (
                    <div key={idx} className="glass-card rounded-3xl p-6 border border-white/10 space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold uppercase font-mono">
                          {ds.format}
                        </span>
                        <span className="text-xs text-slate-400 font-mono">{ds.count}</span>
                      </div>
                      <h3 className="font-heading font-bold text-base text-white">{ds.title}</h3>
                      <p className="text-xs text-slate-300">Source: <strong className="text-white">{ds.org}</strong></p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 8. CONTACT PAGE */}
            {experience === 'contact' && (
              <div className="max-w-3xl mx-auto px-4 py-8 space-y-6 animate-fadeIn">
                <div className="glass-card-glow rounded-3xl p-8 text-center space-y-3">
                  <span className="text-xs font-bold uppercase text-emerald-400 tracking-widest">Hall of Community Hackathon 2.0</span>
                  <h1 className="font-heading font-black text-3xl text-white">Connect with Team KINGPIN</h1>
                  <p className="text-xs text-slate-300">Building Digital Public Infrastructure for India's Small & Marginal Farmers.</p>
                </div>

                <div className="glass-card rounded-3xl p-8 border border-white/10 space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-slate-400 block mb-1">Your Name</label>
                      <input className="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-white" defaultValue="Rameshwar Patel" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">State / District</label>
                      <input className="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-white" defaultValue="Warangal, Telangana" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Message / Collaboration Proposal</label>
                    <textarea rows={4} className="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-white" defaultValue="We want to deploy 10 ROV-BOT swarm units in our Farmer Producer Organization (FPO) cluster..." />
                  </div>

                  <button
                    onClick={() => window.confetti({ particleCount: 50 })}
                    className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-white font-bold text-sm shadow-lg"
                  >
                    Submit Inquiry to Team KINGPIN
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="border-t border-white/10 glass-card py-8 px-4 text-center text-xs text-slate-500 no-print">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span className="font-bold text-slate-300">ROV-BOT + AgriNet AI</span>
                <span>•</span>
                <span>Hall of Community Hackathon 2.0</span>
                <span>•</span>
                <span className="text-emerald-400 font-bold">Team KINGPIN</span>
              </div>

              <div className="text-[11px] text-slate-400">
                Inspired by India's Digital Public Infrastructure (DPI) & AgriStack Vision
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
