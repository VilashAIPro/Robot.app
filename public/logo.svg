<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagonal Tech Ring -->
  <polygon points="100,15 175,55 175,145 100,185 25,145 25,55" stroke="url(#techGrad)" stroke-width="4" fill="#09131f" fill-opacity="0.85" filter="url(#glow)"/>
  
  <!-- Circuit Nodes & Grid -->
  <circle cx="100" cy="15" r="5" fill="#38bdf8" />
  <circle cx="175" cy="55" r="5" fill="#38bdf8" />
  <circle cx="175" cy="145" r="5" fill="#38bdf8" />
  <circle cx="100" cy="185" r="5" fill="#38bdf8" />
  <circle cx="25" cy="145" r="5" fill="#38bdf8" />
  <circle cx="25" cy="55" r="5" fill="#38bdf8" />
  
  <path d="M50 100 L150 100 M100 50 L100 150" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Robot Wheel Treads / Tracks -->
  <rect x="38" y="70" width="16" height="60" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="146" y="70" width="16" height="60" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <!-- Center Agri Leaf with Cyber Veins -->
  <path d="M100 45 C125 65 140 95 130 135 C115 155 85 155 70 135 C60 95 75 65 100 45 Z" fill="url(#leafGrad)" />
  
  <!-- Circuit Vein Inside Leaf -->
  <path d="M100 60 L100 140 M100 80 L118 70 M100 95 L82 85 M100 110 L120 102 M100 125 L80 120" stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Robot Sensor Core / Eye -->
  <circle cx="100" cy="85" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="100" cy="85" r="3" fill="#ffffff" />

  <!-- Solar Cell Pattern on Base -->
  <rect x="80" y="145" width="40" height="12" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="93" y1="145" x2="93" y2="157" stroke="#082f49" stroke-width="1"/>
  <line x1="107" y1="145" x2="107" y2="157" stroke="#082f49" stroke-width="1"/>
</svg>
